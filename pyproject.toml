[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taxonomy-resolver"
version = "0.2.0"
description = "A lightweight Python package for resolving taxonomic names, taxids, and lineage metadata."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Leonor Elias" }]
license = "MIT"
keywords = ["taxonomy", "bioinformatics", "ncbi", "gtdb", "matching", "lineage"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "biopython>=1.86",
  "rapidfuzz>=3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/lore-elias/TaxonTrace.git"
Repository = "https://github.com/lore-elias/TaxonTrace.git"
Issues = "https://github.com/lore-elias/TaxonTrace.git/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
